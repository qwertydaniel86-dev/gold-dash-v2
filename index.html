.hd{display:flex;align-items:center;gap:8px;margin:14px 0 4px}.hd select{background:#141b23;color:#e6edf3;border:1px solid #334155;border-radius:8px;padding:7px 8px;font-size:15px;font-weight:700;max-width:58%}

</style></head><body>
<div class="hd"><select id="sy"></select><span id="st" class="mu"></span><button id="gb">⚙</button></div>
<p class="px" id="pxp"><span id="px">—</span> <span id="arr" style="font-size:44px"></span></p><div id="chg" class="mu">loading…</div>

<div id="cfg"><div class="pn"></div></div>
<script>

var BASE=atob('aHR0cHM6Ly9iaXF1b3RlLmlvL2FwaQ=='),
GR=[['Metals',[['XAUUSD','Gold',2],['XAGUSD','Silver',3],['XPTUSD','Platinum',2]]],
['FX',[['EURUSD','EUR/USD',5],['GBPUSD','GBP/USD',5],['USDJPY','USD/JPY',3],['AUDUSD','AUD/USD',5],['USDCAD','USD/CAD',5],['USDCHF','USD/CHF',5],['NZDUSD','NZD/USD',5]]],
['Crypto',[['BTCUSD','Bitcoin',2],['ETHUSD','Ethereum',2]]],
['Indices & Oil',[['US30','Dow 30',2],['USTEC','Nasdaq 100',2],['US500','S&P 500',2],['USOIL','US Oil',3]]],
['Stocks',[['AAPL','Apple',2],['TSLA','Tesla',2],['NVDA','Nvidia',2],['MSFT','Microsoft',2]]]],
DP={},NM={};GR.forEach(function(g){g[1].forEach(function(s){DP[s[0]]=s[2];NM[s[0]]=s[1]})});
var DEF={slm:'pct',slv:0.05,t1m:'atr',t1v:1.5,t2m:'lvl',t2v:0,mx:5,be:false,tr:false,trm:'pct',trv:0.05,fvg:true,sig:0.02,spk:0.2};
var C={};try{C=JSON.parse(localStorage.gdC2||'{}')||{}}catch(e){}for(var k in DEF)if(C[k]===undefined)C[k]=DEF[k];
function svC(){try{localStorage.gdC2=JSON.stringify(C)}catch(e){}}
var SYM=localStorage.gdS2;if(!DP[SYM])SYM='XAUUSD';
var LV=[],LVsrc='',FV=[],H=[],prev=null,atr=null,bars1=[],lastQ=null,closed=false;
function $(i){return document.getElementById(i)}
function f(x){return x.toFixed(DP[SYM])}
function API(){return BASE+'/'+SYM}
function at(ms){var t=Date.now()-ms,b=null;for(var i=0;i<H.length;i++){if(H[i][0]<=t)b=H[i];else break}return b}
async function j(u){var r=await fetch(u,{cache:'no-store'});return r.json()}
function ld(k){try{return JSON.parse(localStorage[k]||'{}')||{}}catch(e){return{}}}
var EA=ld('gdE2'),PA=ld('gdP2');
function E(){return EA[SYM]||(EA[SYM]=[])}function P(){return PA[SYM]||(PA[SYM]=[])}
function sv(){try{localStorage.gdE2=JSON.stringify(EA);localStorage.gdP2=JSON.stringify(PA)}catch(e){}}
function sel(){var h='';GR.forEach(function(g){h+='<optgroup label="'+g[0]+'">';g[1].forEach(function(s){var n=(EA[s[0]]||[]).length+(PA[s[0]]||[]).length;h+='<option value="'+s[0]+'"'+(s[0]==SYM?' selected':'')+'>'+s[0]+' · '+s[1]+(n?' ●'+n:'')+'</option>'});h+='</optgroup>'});$('sy').innerHTML=h}
function pivots(H_,L_,C_){var p=(H_+L_+C_)/3;return[['R2',p+(H_-L_)],['R1',2*p-L_],['P',p],['S1',2*p-H_],['S2',p-(H_-L_)]]}
async function candles(){var sy=SYM;try{
 var a=(await j(API()+'/ohlc?interval=1m&limit=100')).bars.slice().reverse();if(sy!=SYM)return;bars1=a;
 var h0=H.length?H[0][0]:Infinity,sd=[];a.forEach(function(b){var t=Date.parse(b.openTime)+60000;if(t<h0)sd.push([t,b.close])});if(sd.length)H=sd.concat(H);
 var c=(await j(API()+'/ohlc?interval=5m&limit=60')).bars.slice().reverse();if(sy!=SYM)return;var tr=[];
 for(var i=Math.max(1,c.length-15);i<c.length;i++){var p=c[i-1].close;tr.push(Math.max(c[i].high-c[i].low,Math.abs(c[i].high-p),Math.abs(c[i].low-p)))}
 atr=tr.length?tr.reduce(function(s,x){return s+x},0)/tr.length:null;
 var z=[],mg=(atr||0)*0.1,n=c.length,lo=Math.max(2,n-50);for(var i=lo;i<n;i++){if(i==n-1&&c[i].isOpen)continue;
  if(c[i].low-c[i-2].high>mg)z.push({t:1,lo:c[i-2].high,hi:c[i].low,i:i});else if(c[i-2].low-c[i].high>mg)z.push({t:-1,lo:c[i].high,hi:c[i-2].low,i:i})}
 FV=z.filter(function(g){for(var k=g.i+1;k<n;k++){if(g.t>0?c[k].low<=g.lo:c[k].high>=g.hi)return false}return true});
 try{var d=(await j(API()+'/ohlc?interval=1d&limit=4')).bars,pb=d.filter(function(b){return !b.isOpen})[0];if(sy!=SYM)return;
  if(pb){LV=pivots(pb.high,pb.low,pb.close);LVsrc='prev day pivots'}}catch(e){}
 draw()}catch(e){}}
function draw(){var cv=$('ch'),g=cv.getContext('2d'),W=cv.width,Hh=cv.height;g.clearRect(0,0,W,Hh);if(bars1.length<2)return;
 var v=bars1.map(function(b){return b.close}),mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),r=mx-mn||1;
 g.strokeStyle=v[v.length-1]>=v[0]?'#2ecc71':'#ff5c5c';g.lineWidth=3;g.beginPath();
 v.forEach(function(x,i){var X=i/(v.length-1)*W,Y=Hh-10-(x-mn)/r*(Hh-20);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()}
async function tick(){var sy=SYM;try{var q=await j(API());if(sy!=SYM)return;var m=q.mid,now=Date.now();lastQ=q;H.push([now,m]);while(H.length&&H[0][0]<now-900000)H.shift();
 if(!LV.length){LV=pivots(q.high,q.low,m);LVsrc="today's range"}
 closed=!!q.stale||q.marketState!=='open';
 var px=$('px');px.textContent=f(m);px.className=(prev==null?(q.dayDiffPercent>=0?'up':'dn'):m>prev?'up':m<prev?'dn':(px.className||'up'));prev=m;$('pxp').className='px'+(closed?' cl':'');
 $('chg').innerHTML='<span class="'+(q.dayDiffPercent>=0?'up':'dn')+'">'+(q.dayDiffPercent>=0?'+':'')+q.dayDiffPercent.toFixed(2)+'% today</span> · bid '+f(q.bid)+' / ask '+f(q.ask);
 $('st').textContent=closed?'· market closed':'· live';
 $('hl').textContent=f(q.high)+' / '+f(q.low);
 var b10=at(600000),p10=b10?(m/b10[1]-1)*100:0,s=p10>=C.sig?'BUY':p10<=-C.sig?'SELL':'WAIT';
 $('sig').className='badge '+s;$('sig').textContent=s;$('m10').innerHTML='<span class="'+(p10>=0?'up':'dn')+'">'+(p10>=0?'+':'')+p10.toFixed(3)+'%</span><div class="mu">10 min · ±'+C.sig+'%</div>';
 var b2=at(120000),p2=b2?(m/b2[1]-1)*100:0,k=$('spk');
 if(Math.abs(p2)>=C.spk){k.style.display='block';k.className='spike '+(p2>0?'BUY':'SELL');k.textContent=(p2>0?'▲ SPIKE UP ':'▼ SPIKE DOWN ')+p2.toFixed(2)+'% / 2 min'}else k.style.display='none';var A=$('arr');if(Math.abs(p2)>=C.spk){A.textContent=p2>0?'▲':'▼';A.className=p2>0?'arr-up':'arr-dn'}else{A.textContent='';A.className=''}
 var sd=slD(m),mdn={pct:C.slv+'%',atr:C.slv+'×ATR',pts:C.slv+' pts'}[C.slm];$('atl').textContent='Stop distance ('+mdn+')';
 $('atr').innerHTML=f(sd)+'<div class="mu">long '+f(m-sd)+' · short '+f(m+sd)+'</div>';
 var ni=0;LV.forEach(function(l,i){if(Math.abs(l[1]-m)<Math.abs(LV[ni][1]-m))ni=i});$('lvt').textContent='Key levels ('+LVsrc+')';
 $('lv').innerHTML=LV.map(function(l,i){return '<div class="lv'+(i==ni?' near':'')+'"><span>'+l[0]+' '+f(l[1])+(i==ni?' ← nearest':'')+'</span><span class="mu">'+(l[1]-m>=0?'+':'')+f(l[1]-m)+'</span></div>'}).join('');
 fvr(m);pend(m);pos()}catch(e){$('st').textContent='· reconnecting'}}
function fvr(m){var w=$('fvw'),c=$('fvc');if(!C.fvg){w.style.display='none';c.style.display='none';return}
 var v=FV.filter(function(g){return g.t>0?m>g.lo:m<g.hi}).map(function(g){g.d=(m>=g.lo&&m<=g.hi)?0:Math.min(Math.abs(m-g.lo),Math.abs(m-g.hi));return g}).sort(function(a,b){return a.d-b.d}).slice(0,2);
 c.style.display=v.length?'block':'none';
 $('fvl').innerHTML=v.map(function(g){return '<div class="lv"><span class="'+(g.t>0?'up':'dn')+'">'+(g.t>0?'▲ bull ':'▼ bear ')+f(g.lo)+' – '+f(g.hi)+'</span><span class="mu">'+(g.d?f(g.d)+' away':'inside')+'</span></div>'}).join('');
 var ins=v.filter(function(g){return g.d===0})[0];if(ins){w.style.display='block';w.textContent='⚡ Price entering FVG ('+(ins.t>0?'bullish':'bearish')+')'}else w.style.display='none'}
function slD(p){var a=atr||p*0.002,s=C.slm=='pct'?p*C.slv/100:C.slm=='atr'?C.slv*a:C.slv;return s>0?s:p*0.0005}
function lvls(x){var d=x.d,p=x.p,s=slD(p),a=atr||p*0.002,L=LV.map(function(l){return l[1]});
 function one(m,v){return m=='rr'?v*s:m=='atr'?v*a:m=='pts'?v:0}
 var o=L.filter(function(v){return d*(v-p)>0}).sort(function(u,w){return d*(u-w)}),t1,t2;
 t1=C.t1m=='lvl'?(o.length?o[0]:p+d*s):p+d*(one(C.t1m,C.t1v)||s);
 var o2=o.filter(function(v){return d*(v-t1)>0});
 t2=C.t2m=='lvl'?(o2.length?o2[0]:p+d*2*Math.abs(t1-p)):p+d*(one(C.t2m,C.t2v)||2*Math.abs(t1-p));
 if(d*(t2-t1)<=0)t2=t1+d*Math.abs(t1-p);
 var sl=p-d*s,se=sl,kd='sl';if(x.b===undefined)x.b=p;
 if(C.be&&d*(x.b-t1)>=0&&d*(p-se)>0){se=p;kd='be'}
 if(C.tr){var td=C.trm=='pct'?p*C.trv/100:C.trv*a;if(td>0){var ts=x.b-d*td;if(d*(ts-se)>0){se=ts;kd='tr'}}}
 return{t1:t1,t2:t2,sl:sl,se:se,kd:kd}}
var NT=0;function note(x){var n=$('nt');n.textContent=x;clearTimeout(NT);NT=setTimeout(function(){n.textContent=''},2500)}
function addE(d,p,tag){var l=E();if(l.length>=C.mx){note('Max entries: '+C.mx);return false}l.push({d:d,p:p,b:p});sv();sel();note((tag||(d>0?'BUY':'SELL'))+' #'+l.length+' '+SYM+' at '+f(p));pos();return true}
function add(d){if(prev==null)return;addE(d,prev)}
function tap(el,fn){var t=0;el.addEventListener('touchend',function(e){e.preventDefault();t=Date.now();fn()},{passive:false});el.addEventListener('click',function(){if(Date.now()-t>600)fn()})}
tap($('bB'),function(){add(1)});tap($('bS'),function(){add(-1)});tap($('bC'),function(){EA[SYM]=[];sv();sel();note('All closed');pos()});
$('pos').addEventListener('click',function(e){var x=e.target.closest('[data-x]');if(x){E().splice(+x.dataset.x,1);sv();sel();pos()}});
$('pend').addEventListener('click',function(e){var x=e.target.closest('[data-px]');if(x){P().splice(+x.dataset.px,1);sv();sel();pend(prev)}});
var PN={BS:['BUY STOP',1,1],BL:['BUY LIMIT',1,-1],SS:['SELL STOP',-1,-1],SL:['SELL LIMIT',-1,1]};
function pend(m){var b=$('pend'),l=P();if(m!=null&&!closed){for(var i=l.length-1;i>=0;i--){var o=l[i],n=PN[o.k],hit=n[2]>0?m>=o.lv:m<=o.lv;if(hit&&addE(n[1],o.lv,n[0]+' hit →'+(n[1]>0?' BUY':' SELL'))){l.splice(i,1);sv();sel()}}}
 b.innerHTML=l.map(function(o,i){var n=PN[o.k];return '<div class="ent pe"><div class="el"><b class="'+(n[1]>0?'up':'dn')+'">'+n[0]+'</b> '+SYM+'<div class="mu">@ '+f(o.lv)+'</div></div><div class="ew">⏳ PENDING</div><div class="en mu">'+(m!=null?(o.lv-m>=0?'+':'')+f(o.lv-m):'')+'</div><button class="ex" data-px="'+i+'">✕</button></div>'}).join('')}
function pos(){var b=$('pos'),L=E();document.body.classList.toggle('inpos',L.length>0);
 if(!L.length||prev==null){b.style.display='none';return}
 var m=prev,b2=at(120000),mv2=b2?(m/b2[1]-1)*100:0,ch=false;b.style.display='block';
 b.innerHTML=L.map(function(x,i){var d=x.d,v=lvls(x),pt=(m-x.p)*d;if(d*(m-x.b)>0){x.b=m;ch=true}
  var w='',wc='mu';if(d*(m-v.se)<=0){w=v.kd=='tr'?'🔒 TRAIL STOP':v.kd=='be'?'🔒 BREAKEVEN':'⛔ STOP LOSS';wc='dn'}else if(d*(m-v.t2)>=0){w='✅ TAKE ALL (TP2)';wc='up'}else if(d*(m-v.t1)>=0){w='💰 TAKE PROFIT (TP1)';wc='up'}else if(d*mv2<=-C.sig){w='↘ AGAINST YOU';wc='dn'}else if(pt>0&&((d>0&&$('sig').textContent==='SELL')||(d<0&&$('sig').textContent==='BUY'))){w='⚠ SECURE PROFIT';wc='WAITc'}else if(d*mv2>=C.sig){w='↗ YOUR WAY';wc='up'}else w='→ Flat';
  return '<div class="ent"><div class="el"><b class="'+(d>0?'up':'dn')+'">'+(d>0?'BUY':'SELL')+' #'+(i+1)+'</b> '+SYM+' @ '+f(x.p)+'<div class="mu">TP1 '+f(v.t1)+' · TP2 '+f(v.t2)+' · SL '+f(v.se)+(v.kd!='sl'?' ('+(v.kd=='be'?'BE':'trail')+')':'')+'</div></div><div class="ew '+wc+(w.charAt(0)==='→'?'':' bl')+'">'+w+'</div><div class="en '+(pt>=0?'up':'dn')+'">'+(pt>=0?'+':'')+f(pt)+'<div class="mu">'+(pt>=0?'+':'')+(pt/x.p*100).toFixed(3)+'%</div></div><button class="ex" data-x="'+i+'">✕</button></div>'}).join('');
 if(ch)sv()}
// settings
function ps(){return prev||(lastQ&&lastQ.mid)||1}
function nr(k,st,mn,mx){return '<input type="number" inputmode="decimal" data-k="'+k+'" value="'+C[k]+'" step="'+(st||'any')+'"'+(mn!=null?' min="'+mn+'"':'')+(mx!=null?' max="'+mx+'"':'')+'>'}
function so(k,o){return '<select data-k="'+k+'" data-m="1">'+o.map(function(x){return '<option value="'+x[0]+'"'+(C[k]==x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>'}
function ck(k){return '<input type="checkbox" data-k="'+k+'"'+(C[k]?' checked':'')+'>'}
var UN={rr:'× SL',atr:'× ATR',pts:'pts',pct:'%'};
function tpr(l,m,v){return '<div class="fr"><span>'+l+'</span>'+so(m,[['rr','R:R'],['atr','ATR'],['lvl','Key level'],['pts','Points']])+(C[m]=='lvl'?'<span style="width:84px"></span>':nr(v,'any',0))+'<span class="u">'+(UN[C[m]]||'')+'</span></div>'}
function rcfg(){$('cfg').firstChild.innerHTML='<h2>⚙ Strategy <button id="cx">Done</button></h2><div class="mu">Applies to entry levels & warnings · '+SYM+'</div>'+
